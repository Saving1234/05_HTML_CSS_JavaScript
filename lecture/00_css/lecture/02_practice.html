<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

    /* flex라고 지정하는 순간, 아이템들은 플렉스 안에 들어가게 된다.?? */

.container {
    display: flex;
    border: 2px dashed black;
    background: gray;
    gap: 10px;
    /* height: 800px; */
    
}

.item {
    background: greenyellow;
    color: black;
    padding: 15px;
    text-align: center;
    width: 500px;
    /* height: 100px; */
}

/* flex-directrion : 
나열 순서 정하는 것. 클래스를 새로 추가해도, flex 안에 들어가게 됨. 컨테이너 옆에 클래스 명을 넣어서. 
flex의 방향.
*/

.fl-di {
    /* flex-direction: column; */
    flex-direction: row-reverse;
}

.fl-column {
    flex-direction: row; 
}

/* 넘치면 내려오도록.
flex-wrap: nowrap; 기본값
*/
.wrap{
    flex-wrap: nowwrap;
}

/* 기준축 정렬 */

.jc {
    /* justify-content: center;  가운데 정렬 */
    /* justify-content: space-between; */
    justify-content: center; 
}

/* 교차축 정렬 */
.ai {
    /* align-items: stretch; */
    align-items: center;
}

/* 여백 공간을 얼마나 많이 차지할지. 비율. */
.fl {
    flex: 1;
}


.fl-2{
    flex: 2;
}



</style>

</head>
<body>
    <h1>flex 연습</h1>
    <br/>
    <div class="container fl-di wrap jc ai fl"> 
        <div class="item fl">1</div>
        <div class="item fl-2">2</div>
       


    </div>

    <br/>

    <h2>나열 순서 기본값</h2>
    <div class="container fl-column ai">

         <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>

    </div>
    
</body>
</html>
